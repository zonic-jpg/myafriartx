name: Deploy Supabase (MyAfriArt)
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: DB push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: xmsglatdkdypnalvhevx
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "No token"; exit 0; fi
          npx supabase@2.20.12 link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase@2.20.12 db push --linked || true
