name: Supabase Check (MyAfriArt)
# Guardrail: runs `supabase db lint` against the linked project on every push
# and PR that touches the database, so RLS gaps, missing indexes, and other
# schema/security issues are caught in CI before deploy-supabase.yml pushes
# migrations and before Netlify builds the site from the same commit.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-check.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-check.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Supabase db lint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: xmsglatdkdypnalvhevx
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set on this repo — cannot lint against the linked project."
            exit 1
          fi
          npx supabase@2.20.12 link --project-ref "$SUPABASE_PROJECT_REF"
          # --level warning: fail the job on warnings too (e.g. anon-callable
          # SECURITY DEFINER functions, missing RLS), not just hard errors.
          npx supabase@2.20.12 db lint --linked --level warning
