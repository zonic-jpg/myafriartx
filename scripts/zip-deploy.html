<!doctype html>
<html><body><pre id="log">zip deploy...</pre><script>
const TOKEN='nfc_UcjLa6VSsXqxJMqMN5m3Rj8WdgkHaRy723ab';
const SITE='7717c70f-3e72-444c-b7c0-9d96f705f60c';
const log=x=>document.getElementById('log').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
(async()=>{
  log('fetching zip...');
  const zip=await fetch('deploy.zip').then(r=>r.arrayBuffer());
  log('uploading '+zip.byteLength+' bytes...');
  const r=await fetch(`https://api.netlify.com/api/v1/sites/${SITE}/deploys`,{
    method:'POST',
    headers:{Authorization:`Bearer ${TOKEN}`,'Content-Type':'application/zip'},
    body:zip
  });
  const d=await r.json();
  if(!r.ok) throw new Error(r.status+' '+JSON.stringify(d));
  log({deploy:d.id,state:d.state,url:d.ssl_url});
  for(let i=0;i<60;i++){
    await new Promise(x=>setTimeout(x,3000));
    const st=await fetch(`https://api.netlify.com/api/v1/deploys/${d.id}`,{headers:{Authorization:`Bearer ${TOKEN}`}}).then(x=>x.json());
    log({state:st.state,url:st.ssl_url,published:st.published_at});
    if(st.state==='ready'){
      window.__done={deploy:d.id,state:st.state,url:'https://myafriartx.netlify.app'};
      return;
    }
    if(st.state==='error') throw new Error(st.error_message||'error');
  }
  window.__done={timeout:true,deploy:d.id};
})().catch(e=>{log('ERR '+e);window.__done={error:String(e)};});
</script></body></html>
