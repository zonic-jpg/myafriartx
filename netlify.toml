# MyAfriArtX — static SPA on Netlify (prebuilt dist/client in repo)
[build]
  command = "echo 'Publishing prebuilt dist/client'"
  publish = "dist/client"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
