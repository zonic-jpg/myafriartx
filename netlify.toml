# MyAfriArtX — Netlify: static client + serverless stage-room
[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  VITE_GOOGLE_AUTH = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["ws", "bufferutil", "utf-8-validate"]

[functions."stage-room"]
  timeout = 60

# Cold /auth links → login
[[redirects]]
  from = "/auth"
  to = "/login"
  status = 302
  force = true

[[redirects]]
  from = "/auth/*"
  to = "/login"
  status = 302
  force = true

# Stage API before SPA catch-all
[[redirects]]
  from = "/api/stage-room"
  to = "/.netlify/functions/stage-room"
  status = 200
  force = true

[[redirects]]
  from = "/api/stage-room/"
  to = "/.netlify/functions/stage-room"
  status = 200
  force = true

# Only these two routes are standalone Netlify Functions (netlify/functions/*.mjs).
# Every other /api/* path (chat, bridge/enter, webhooks/paystack, cron/auctions, ...)
# is a TanStack Start SSR server route and must fall through to the app's own
# SSR function — a blanket "/api/* -> /.netlify/functions/:splat" here was
# force-redirecting all of those to non-existent functions, producing 404s
# (this is what broke the AI Concierge and in-app chat).
[[redirects]]
  from = "/api/admin-bridge"
  to = "/.netlify/functions/admin-bridge"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-bridge/"
  to = "/.netlify/functions/admin-bridge"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
