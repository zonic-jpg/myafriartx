# MyAfriArtX — Netlify: static client + serverless stage-room
[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  VITE_GOOGLE_AUTH = "false"

[functions]
  node_bundler = "esbuild"

[functions."stage-room"]
  timeout = 60

# Cold /auth links → login
[[redirects]]
  from = "/auth"
  to = "/login"
  status = 302
  force = true

[[redirects]]
  from = "/auth/*"
  to = "/login"
  status = 302
  force = true

# Stage API before SPA catch-all
[[redirects]]
  from = "/api/stage-room"
  to = "/.netlify/functions/stage-room"
  status = 200
  force = true

[[redirects]]
  from = "/api/stage-room/"
  to = "/.netlify/functions/stage-room"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
