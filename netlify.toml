# MyAfriArtX — static SPA on Netlify (prebuilt dist/client in repo)
[build]
  command = "echo 'Publishing prebuilt dist/client'"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"
  # VITE_SUPABASE_URL — set via Netlify UI/API env (do not hardcode)
  # VITE_SUPABASE_PUBLISHABLE_KEY — set via Netlify UI/API env (do not hardcode)
  # VITE_SUPABASE_PROJECT_ID — set via Netlify UI/API env (do not hardcode)
  VITE_GOOGLE_AUTH = "false"

# Cold /auth links (content loaders, ZonicMe hub) → login
[[redirects]]
  from = "/auth"
  to = "/login"
  status = 302
  force = true

[[redirects]]
  from = "/auth/*"
  to = "/login"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
