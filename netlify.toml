# MyAfriArtX — static SPA on Netlify (TanStack Start SPA mode)
[build]
  command = "test -f dist/client/index.html || (npx vite build --config vite.config.netlify.ts && cp dist/client/_shell.html dist/client/index.html && cp dist/client/_shell.html dist/client/404.html)"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
